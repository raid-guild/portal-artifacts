<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#263c58"/><meta name="description" content="A living desert reverie. Explore a sculpted oasis, touch its water, and watch an airship drift through the sunset."/><title>Sirocco — A desert reverie</title><link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg"/></head><body><canvas id="scene" aria-label="Interactive three-dimensional desert oasis. Drag to look around, scroll to zoom, and tap the water to make ripples." tabindex="0"></canvas><div id="loading"><span class="loading-orbit"></span><p>Crossing the dunes</p><small id="load-status">Preparing the oasis</small></div><header><div class="brand"><span class="brand-mark">◉</span><span>SIROCCO<small>A DESERT REVERIE</small></span></div><div class="chapter">THE STILLWATER EXPANSE<span>23° 18′ N &nbsp; / &nbsp; 07° 42′ E</span></div></header><details id="atmosphere" class="atmosphere" open>
<summary><span class="tuning-icon" aria-hidden="true">☷</span> Atmosphere <span class="panel-chevron" aria-hidden="true">⌄</span></summary>
<div class="atmosphere-body">
<div class="tuning-row"><label for="tune-hour">Time of day</label><output id="tune-hour-value" for="tune-hour"></output><input type="range" id="tune-hour" name="hour" min="0" max="24" step="0.25" value="17.5"></div>
<div class="tuning-row"><label for="tune-storm">Sandstorm</label><output id="tune-storm-value" for="tune-storm"></output><input type="range" id="tune-storm" name="storm" min="0" max="100" step="1" value="0"></div>
<div class="tuning-row"><label for="tune-wind">Wind</label><output id="tune-wind-value" for="tune-wind"></output><input type="range" id="tune-wind" name="wind" min="0" max="100" step="1" value="35"></div>
<div class="tuning-row"><label for="tune-grain">Texture / grit</label><output id="tune-grain-value" for="tune-grain"></output><input type="range" id="tune-grain" name="grain" min="0" max="100" step="1" value="12"></div>
<div class="tuning-row"><label for="tune-ripple">Ripple strength</label><output id="tune-ripple-value" for="tune-ripple"></output><input type="range" id="tune-ripple" name="ripple" min="0" max="200" step="5" value="100"></div>
<button type="button" id="restore-atmosphere">Restore sunset</button></div></details><div class="water-hint" id="water-hint"><span>◎</span> Touch the stillness</div><footer><div class="scene-label"><span class="line"></span><span>01 <em>/</em> THE OASIS</span></div><div class="controls"><button id="tour" aria-pressed="false" title="Start a slow camera journey"><span>◈</span> Drift</button><button id="sound" aria-pressed="false" title="Toggle ambient desert sound"><span>♪</span> Sound</button><button id="reset" title="Return to the original view"><span>↺</span> Reset view</button><button id="hide" title="Hide interface (H)" aria-label="Hide interface">⛶</button></div><div class="instructions">DRAG TO EXPLORE <span>·</span> SCROLL TO APPROACH</div></footer><button id="show" aria-label="Show interface" hidden>↗</button><div class="toast" role="status" id="toast"></div><script type="module" src="/src/main.js"></script></body></html>
