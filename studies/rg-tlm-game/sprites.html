<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Traveler motion study — The Last Mile</title></head>
<body>
  <main>
    <header><a href="./">← Back to the game</a><p class="eyebrow">THE LAST MILE · CHARACTER ART</p><h1>The traveler, in motion.</h1><p>Four directions, six walking frames, and a standing pose for each view.</p></header>
    <section class="controls" aria-label="Animation controls"><button id="pause" disabled>Pause</button><button id="idle" disabled>Show standing poses</button><label>Walking pace <input id="pace" type="range" min="0.5" max="1.5" step="0.1" value="1"><output id="pace-value">1×</output></label><span id="status" role="status">Loading sprites…</span></section>
    <section class="poses" aria-label="Directional animation previews"></section>
    <footer>Original generated atlases are preserved. Left-facing movement mirrors the right-facing sheet.</footer>
  </main>
  <script type="module" src="/src/sprite-preview.ts"></script>
</body>
</html>
