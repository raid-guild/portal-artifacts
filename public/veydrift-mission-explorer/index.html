<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Read-only after-action plots of public Veydrift missions." />
    <title>Rift Plot — Veydrift Mission Explorer</title>
    <link rel="stylesheet" href="/veydrift-mission-explorer/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/veydrift-mission-explorer/mission/26031" aria-label="Rift Plot home">
          <span class="kicker">Veydrift public index</span>
          <strong>Rift Plot</strong>
        </a>
        <form id="missionForm" class="mission-search">
          <label class="sr-only" for="missionInput">Mission number</label>
          <input id="missionInput" inputmode="numeric" autocomplete="off" placeholder="Mission #26031" />
          <button type="submit">Plot</button>
        </form>
        <nav>
          <a href="#live-board">Live board</a>
          <span class="read-only">Read only</span>
        </nav>
      </header>

      <main id="app" aria-live="polite">
        <section class="loading panel">
          <span class="loader" aria-hidden="true"></span>
          <p>Reading mission telemetry…</p>
        </section>
      </main>

      <footer>
        <span>Public onchain data · no wallet connection</span>
        <a href="https://www.raidguild.org/" target="_blank" rel="noopener noreferrer"><span class="swords" aria-hidden="true">⚔</span> Built by RaidGuild</a>
      </footer>
    </div>
    <script src="/veydrift-mission-explorer/app.js" defer></script>
  </body>
</html>
